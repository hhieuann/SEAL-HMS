spring:
  application:
    name: seal-hms
  config:
    import: "optional:file:./.env.properties"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seal_hms}?options=-c%20TimeZone=UTC
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      # How long a request waits for a connection when the pool has none to give — which, with
      # PostgreSQL down, is every request. Hikari's default of 30 s meant the health check (and any
      # page) took half a minute to report the outage; 10 s is plenty for a database on localhost.
      connection-timeout: 10000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: validate          # NEVER 'update' on the shared repo
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:please_change_me_to_a_long_random_secret_key}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  demo:
    # Admin-only endpoints that bulk-create demo events, teams and accounts. Off unless asked
    # for: with this false the controller bean is not created, so /api/v1/admin/demo 404s.
    # Set APP_DEMO_ENABLED=true in backend/.env.properties to use it locally.
    enabled: ${APP_DEMO_ENABLED:false}

server:
  port: 8080

# Health check at /actuator/health. Anyone can ask (SecurityConfig whitelists the path) but only
# gets "UP"/"DOWN"; an ADMIN token additionally gets the components (db, diskSpace, schema) that
# the admin dashboard's System Health panel displays. Nothing else from Actuator is exposed.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN

springdoc:
  swagger-ui:
    path: /swagger-ui.html
